{% set name = "langchain-classic" %}
{% set version = "1.1.0" %}
{% set build = 0 %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/dd/2c/6f6ed6acd89f1d1acdb429c2fad4a99cf8788e9020cd0b6deec190797788/langchain_classic-{{ version }}.tar.gz
  sha256: 770902e38ffec85bf74b80616ea536265f439aed1c918e3fe2b8b4c0ca7a29aa

build:
  number: {{ build }}
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - pip
  run:
    - python >={{ python_min }}
    - langchain-core >=1.4.7,<2.0.0
    - langchain-text-splitters >=1.1.2,<2.0.0
    - langsmith >=0.14.4,<1.0.0
    - pydantic >=2.7.4,<3.0.0
    - sqlalchemy >=1.4.0,<3.0.0
    - requests >=2.0.0,<3.0.0
    - pyyaml >=5.3.0,<7.0.0

test:
  imports:
    - langchain_classic
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}.*

about:
  home: https://github.com/langchain-ai/langchain/
  doc_url: https://reference.langchain.com/python/langchain_classic/
  summary: Building applications with LLMs through composability
  dev_url: https://github.com/langchain-ai/langchain/tree/master/libs/langchain
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - ccurme
    - mdrxy
